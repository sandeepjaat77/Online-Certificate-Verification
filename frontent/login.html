<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Certificate Verification
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>


    <!-- Login Form -->

    <div class="form-container">

        <h1>
            Login
        </h1>


        <form id="loginForm">


            <!-- Email -->

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- Password -->

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <!-- Submit -->

            <button type="submit">
                Login
            </button>

        </form>


        <!-- Message -->

        <p id="message"></p>


        <p class="account-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
