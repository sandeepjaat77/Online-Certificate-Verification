```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Certificate</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .verify-container {
            width: 90%;
            max-width: 700px;
            margin: 70px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
            text-align: center;
        }

        .verify-container h1 {
            color: #2563eb;
            margin-bottom: 15px;
        }

        .verify-container p {
            color: #555;
            margin-bottom: 25px;
        }

        #verifyForm {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        #certificateId {
            flex: 1;
            min-width: 250px;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #certificateId:focus {
            border-color: #2563eb;
        }

        #verifyForm button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #verifyForm button:hover {
            background: #1d4ed8;
        }

        #verifyForm button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            margin-top: 25px;
            font-size: 17px;
            font-weight: bold;
        }

        #certificateResult {
            margin-top: 25px;
        }

        .verification-card {
            padding: 25px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .verification-card h2 {
            color: #198754;
            text-align: center;
            margin-bottom: 20px;
        }

        .verification-card p {
            margin: 12px 0;
            color: #333;
        }

        .valid-status {
            color: #198754;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .verify-container {
                width: 92%;
                padding: 25px;
                margin: 35px auto;
            }

            #certificateId {
                width: 100%;
                flex: none;
            }

            #verifyForm button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="logo">
            Certificate Verification
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>



    <!-- ================= VERIFICATION ================= -->

    <div class="verify-container">

        <h1>
            Verify Certificate
        </h1>

        <p>
            Enter the Certificate ID to verify
            the authenticity of the certificate.
        </p>


        <form id="verifyForm">

            <input
                type="text"
                id="certificateId"
                placeholder="Enter Certificate ID"
                autocomplete="off"
                required
            >

            <button
                type="submit"
                id="verifyButton"
            >
                Verify Certificate
            </button>

        </form>


        <div id="message"></div>

        <div id="certificateResult"></div>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const API_BASE_URL =
            "https://online-certificate-verification-owsv.onrender.com";


        const verifyForm =
            document.getElementById(
                "verifyForm"
            );


        const certificateInput =
            document.getElementById(
                "certificateId"
            );


        const verifyButton =
            document.getElementById(
                "verifyButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const certificateResult =
            document.getElementById(
                "certificateResult"
            );



        // ==========================================
        // VERIFY CERTIFICATE FUNCTION
        // ==========================================

        async function verifyCertificate(
            certificateId
        ) {

            if (!certificateId) {

                message.innerText =
                    "Please enter Certificate ID.";

                message.style.color =
                    "red";

                return;

            }


            message.innerText =
                "Verifying certificate...";

            message.style.color =
                "#2563eb";


            certificateResult.innerHTML =
                "";


            verifyButton.disabled =
                true;

            verifyButton.innerText =
                "Verifying...";


            try {

                const response =
                    await fetch(

                        API_BASE_URL +
                        "/api/certificates/verify/" +
                        encodeURIComponent(
                            certificateId
                        ),

                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }

                    );


                const data =
                    await response.json();


                console.log(
                    "Verification response:",
                    data
                );


                if (!response.ok) {

                    message.innerText =
                        data.message ||
                        "Certificate not found.";

                    message.style.color =
                        "red";

                    return;

                }


                if (
                    data.valid === true &&
                    data.certificate
                ) {

                    const certificate =
                        data.certificate;


                    message.innerText =
                        "✓ Certificate is valid";

                    message.style.color =
                        "green";


                    certificateResult.innerHTML = `

                        <div class="verification-card">

                            <h2>
                                ✓ Valid Certificate
                            </h2>

                            <p>
                                <strong>
                                    Certificate ID:
                                </strong>

                                ${
                                    certificate.certificateId ||
                                    certificateId
                                }
                            </p>

                            <p>
                                <strong>
                                    Recipient:
                                </strong>

                                ${
                                    certificate.recipientName ||
                                    "N/A"
                                }
                            </p>

                            <p>
                                <strong>
                                    Course:
                                </strong>

                                ${
                                    certificate.courseName ||
                                    "N/A"
                                }
                            </p>

                            <p>
                                <strong>
                                    Email:
                                </strong>

                                ${
                                    certificate.recipientEmail ||
                                    "N/A"
                                }
                            </p>

                            <p>
                                <strong>
                                    Issue Date:
                                </strong>

                                ${
                                    certificate.issueDate
                                    ? new Date(
                                        certificate.issueDate
                                    ).toLocaleDateString()
                                    : "N/A"
                                }
                            </p>

                            <p>
                                <strong>
                                    Expiry Date:
                                </strong>

                                ${
                                    certificate.expiryDate
                                    ? new Date(
                                        certificate.expiryDate
                                    ).toLocaleDateString()
                                    : "No Expiry"
                                }
                            </p>

                            <p>
                                <strong>
                                    Status:
                                </strong>

                                <span class="valid-status">
                                    VALID
                                </span>
                            </p>

                        </div>

                    `;

                }

                else {

                    message.innerText =
                        data.message ||
                        "Certificate is not valid.";

                    message.style.color =
                        "red";

                }


            }

            catch (error) {

                console.error(
                    "Verification error:",
                    error
                );


                message.innerText =
                    "Unable to connect to verification server.";

                message.style.color =
                    "red";

            }


            finally {

                verifyButton.disabled =
                    false;

                verifyButton.innerText =
                    "Verify Certificate";

            }

        }



        // ==========================================
        // MANUAL VERIFICATION
        // ==========================================

        verifyForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const certificateId =
                    certificateInput.value.trim();


                verifyCertificate(
                    certificateId
                );

            }
        );



        // ==========================================
        // QR CODE AUTO VERIFICATION
        // ==========================================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const qrCertificateId =
            urlParams.get("id");


        if (qrCertificateId) {

            certificateInput.value =
                qrCertificateId;


            verifyCertificate(
                qrCertificateId
            );

        }

    </script>


</body>

</html>
