<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Certificate</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <h1>
            Generate Certificate
        </h1>


        <form id="certificateForm">

            <input
                type="text"
                id="recipientName"
                placeholder="Recipient Name"
                required
            >


            <input
                type="email"
                id="recipientEmail"
                placeholder="Recipient Email"
                required
            >


            <input
                type="text"
                id="courseName"
                placeholder="Course Name"
                required
            >


            <label for="expiryDate">
                Expiry Date
            </label>


            <input
                type="date"
                id="expiryDate"
            >


            <button type="submit">
                Generate Certificate
            </button>

        </form>


        <p id="message"></p>


        <div id="certificateIdResult"></div>


        <div id="qrcode"></div>


        <a
            id="verifyLink"
            href="#"
            target="_blank"
        ></a>

    </div>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    ></script>


    <script src="js/create-certificate.js"></script>

</body>

</html>
