```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Generate Certificate</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="page">

        <div class="generator-card">

            <div class="header">

                <div class="icon">
                    🎓
                </div>

                <h1>
                    Generate Certificate
                </h1>

                <p>
                    Create a secure digital certificate
                    with a unique Certificate ID and QR code.
                </p>

            </div>


            <form id="certificateForm">

                <div class="form-group">

                    <label for="recipientName">
                        Recipient Name
                    </label>

                    <input
                        type="text"
                        id="recipientName"
                        placeholder="Enter recipient name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="recipientEmail">
                        Recipient Email
                    </label>

                    <input
                        type="email"
                        id="recipientEmail"
                        placeholder="Enter recipient email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="courseName">
                        Course Name
                    </label>

                    <input
                        type="text"
                        id="courseName"
                        placeholder="Enter course name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="expiryDate">
                        Expiry Date
                    </label>

                    <input
                        type="date"
                        id="expiryDate"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="generate-btn"
                >
                    Generate Certificate
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div
                id="certificateIdResult"
                class="result-card"
            ></div>


            <div
                id="qrcode"
                class="qr-container"
            ></div>


            <a
                id="verifyLink"
                href="#"
                target="_blank"
                class="verify-link"
            ></a>

        </div>

    </div>


    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    ></script>


    <script src="js/create-certificate.js"></script>

</body>

</html>
```
